<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全国招聘标讯数据看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei","微软雅黑",sans-serif;background:#f0f2f5;color:#333}
.header{background:linear-gradient(135deg,#1a73e8,#0d47a1);color:white;padding:20px 32px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px;font-weight:600}
.header .sub{font-size:13px;opacity:.85;margin-top:4px}
.header .time{font-size:13px;opacity:.9}
.kpi-row{display:flex;gap:16px;padding:20px 32px}
.kpi-card{flex:1;background:white;border-radius:12px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.08);position:relative;overflow:hidden}
.kpi-card::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%}
.kpi-card:nth-child(1)::before{background:#1a73e8}
.kpi-card:nth-child(2)::before{background:#f9a825}
.kpi-card:nth-child(3)::before{background:#43a047}
.kpi-card:nth-child(4)::before{background:#e53935}
.kpi-label{font-size:13px;color:#888;margin-bottom:8px}
.kpi-val{font-size:32px;font-weight:700}
.kpi-card:nth-child(1) .kpi-val{color:#1a73e8}
.kpi-card:nth-child(2) .kpi-val{color:#f9a825}
.kpi-card:nth-child(3) .kpi-val{color:#43a047}
.kpi-card:nth-child(4) .kpi-val{color:#e53935}
.kpi-unit{font-size:14px;color:#999;margin-left:4px}
.kpi-sub{font-size:12px;color:#aaa;margin-top:6px}
.charts-row{display:flex;gap:16px;padding:0 32px 20px;flex-wrap:wrap}
.chart-box{background:white;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);flex:1;min-width:300px}
.chart-box.wide{flex:2;min-width:500px}
.chart-box canvas{max-height:300px}
.chart-title{font-size:15px;font-weight:600;color:#333;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #eee}
.table-section{padding:0 32px 32px}
.table-box{background:white;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.table-title{font-size:15px;font-weight:600;color:#333;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #eee}
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid #ddd;background:white;cursor:pointer;font-size:12px;color:#666;transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:#1a73e8;color:white;border-color:#1a73e8}
.filter-select{padding:6px 12px;border:1px solid #ddd;border-radius:20px;font-size:12px;background:white;color:#666;cursor:pointer}
.filter-select:focus{outline:none;border-color:#1a73e8}
.date-input{padding:6px 12px;border:1px solid #ddd;border-radius:20px;font-size:12px;background:white;color:#666;width:auto}
.date-input:focus{outline:none;border-color:#1a73e8}
th{background:#f5f7fa;color:#555;font-weight:600;padding:10px 12px;text-align:left;border-bottom:2px solid #e0e0e0;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f0f0f0;vertical-align:top}
tr:hover{background:#f8f9ff}
.money-cell{font-weight:600;color:#1a73e8}
a{color:#1a73e8;text-decoration:none;font-size:12px}
a:hover{text-decoration:underline}
.prov-scroll{max-height:260px;overflow-y:auto;padding-right:4px}
.prov-scroll::-webkit-scrollbar{width:6px}
.prov-scroll::-webkit-scrollbar-thumb{background:#c5cae9;border-radius:3px}
.prov-bar{display:flex;align-items:center;margin-bottom:8px;font-size:13px}
.prov-name{width:100px;text-align:right;padding-right:12px;color:#555;flex-shrink:0}
.prov-fill{height:24px;border-radius:4px;background:linear-gradient(90deg,#1a73e8,#4fc3f7);color:white;display:flex;align-items:center;padding-left:8px;font-size:12px;font-weight:600;min-width:30px;transition:width .6s}
.row-diamond{background:#fffde7!important}
.row-hot{background:#fff3e0!important}
.table-scroll{max-height:70vh;overflow-y:auto}
.title-col{max-width:400px;overflow:hidden;text-overflow:ellipsis}
.date-col{white-space:nowrap}
.loading{text-align:center;padding:60px;color:#999;font-size:16px}
@media(max-width:768px){
  .kpi-row{flex-direction:column}
  .charts-row{flex-direction:column}
  .header{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📊 全国招聘标讯数据看板</h1>
    <div class="sub" id="headerSub">数据来源：全网招投标数据 | 排除：社保代缴/体检服务商/HR外包/劳务派遣</div>
  </div>
  <div class="time" id="headerTime">加载中...</div>
</div>

<div class="kpi-row">
  <div class="kpi-card">
    <div class="kpi-label">累计有效标讯</div>
    <div class="kpi-val" id="kpiTotal">-</div>
    <div class="kpi-sub" id="kpiTotalSub">-</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">💎 高价值标讯（≥50万）</div>
    <div class="kpi-val" id="kpiHigh">-</div>
    <div class="kpi-sub" id="kpiHighSub">-</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">累计预算总额</div>
    <div class="kpi-val" id="kpiBudget">-</div>
    <div class="kpi-sub" id="kpiBudgetSub">-</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">🏷 服务类型</div>
    <div class="kpi-val" id="kpiSvcType">-</div>
    <div class="kpi-sub" id="kpiSvcTypeSub">-</div>
  </div>
</div>

<div class="charts-row">
  <div class="chart-box wide"><div class="chart-title">📈 每日有效标讯趋势</div><div style="height:280px"><canvas id="trendChart"></canvas></div></div>
  <div class="chart-box"><div class="chart-title">💰 全量价格分布</div><div style="height:280px"><canvas id="pricePie"></canvas></div></div>
</div>

<div class="charts-row">
  <div class="chart-box"><div class="chart-title">🔧 全量服务类型分布</div><div style="height:280px"><canvas id="svcPie"></canvas></div></div>
  <div class="chart-box wide"><div class="chart-title">🗺 省份累计分布（Top 15）</div><div class="prov-scroll" id="provBars"></div></div>
</div>

<div class="charts-row">
  <div class="chart-box wide"><div class="chart-title">📊 每日服务类型分布（堆叠）</div><div style="height:300px"><canvas id="stackChart"></canvas></div></div>
  <div class="chart-box"><div class="chart-title">📈 每日预算金额趋势</div><div style="height:280px"><canvas id="budgetChart"></canvas></div></div>
</div>

<div class="table-section">
  <div class="table-box">
    <div class="table-title" id="tableTitle">📋 全量标讯明细</div>
    <div class="filter-bar" id="filterBar">
      <span style="font-size:12px;color:#888;margin-right:4px">档位：</span>
      <button class="filter-btn tier-btn active" onclick="filterTier('all',this)">全部</button>
      <button class="filter-btn tier-btn" onclick="filterTier('diamond',this)">💎 钻石级</button>
      <button class="filter-btn tier-btn" onclick="filterTier('hot',this)">🔥 火热级</button>
      <button class="filter-btn tier-btn" onclick="filterTier('normal',this)">🏆 有预算</button>
      <button class="filter-btn tier-btn" onclick="filterTier('nobudget',this)">无预算</button>
      <span style="margin-left:12px;font-size:12px;color:#888">日期：</span>
      <input type="date" class="date-input" id="dateFilter" onchange="applyAllFilters()">
      <button class="filter-btn" onclick="clearDateFilter()">✕ 清除日期</button>
      <span style="margin-left:12px;font-size:12px;color:#888">地区：</span>
      <select class="filter-select" id="provFilter" onchange="applyAllFilters()"><option value="all">全部地区</option></select>
      <span id="svcBtns"></span>
    </div>
    <div class="table-scroll">
      <table style="width:100%;border-collapse:collapse">
        <thead><tr><th>项目名称</th><th>招标方</th><th>预算</th><th>服务类型</th><th>省份</th><th>发布时间</th><th>链接</th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
var D=null, charts={};
var COLORS=['#1a73e8','#f9a825','#43a047','#e53935','#7b1fa2','#00838f','#ff6f00','#5d4037','#00897b','#1565c0','#c62828','#4e342e','#00695c','#283593','#ad1457','#37474f'];

fetch('dashboard_data.json').then(r=>r.json()).then(data=>{
  D=data; render();
}).catch(e=>{
  document.getElementById('tableBody').innerHTML='<tr><td colspan="7" style="text-align:center;padding:40px;color:#999">数据加载失败: '+e.message+'</td></tr>';
});

function render(){
  var s=D.stats, items=D.items;
  var dates=Object.keys(D.date_dist).sort();
  var dateRange=dates.length>=2?dates[0]+' ~ '+dates[dates.length-1]:'';

  // Header
  document.getElementById('headerSub').textContent='数据来源：全网招投标数据 | 排除：社保代缴/体检服务商/HR外包/劳务派遣 | '+dateRange;
  document.getElementById('headerTime').textContent='最近更新：'+new Date().toISOString().slice(0,10);

  // KPI
  var budgetStr=s.total_budget>=10000?'¥'+(s.total_budget/10000).toFixed(2)+'亿':'¥'+s.total_budget.toFixed(0)+'万';
  var highVal=s.diamond+s.fire, highPct=Math.round(highVal/s.total*100);
  var provCount=Object.keys(D.province_dist).length;
  var svcTypes=Object.keys(D.type_dist).length;
  var execDays=dates.length;

  document.getElementById('kpiTotal').innerHTML=s.total+'<span class="kpi-unit">条</span>';
  document.getElementById('kpiTotalSub').textContent='覆盖 '+provCount+' 个省份';
  document.getElementById('kpiHigh').innerHTML=highVal+'<span class="kpi-unit">条</span>';
  document.getElementById('kpiHighSub').textContent='占比 '+highPct+'%';
  document.getElementById('kpiBudget').textContent=budgetStr;
  document.getElementById('kpiBudgetSub').textContent='💎 100万+：'+s.diamond+'条 | 🔥 50-100万：'+s.fire+'条';
  document.getElementById('kpiSvcType').innerHTML=svcTypes+'<span class="kpi-unit">种</span>';
  document.getElementById('kpiSvcTypeSub').textContent='共 '+execDays+' 个执行日';

  // Province bars
  var provSorted=Object.entries(D.province_dist).sort((a,b)=>b[1]-a[1]).slice(0,15);
  var provMax=provSorted[0]?provSorted[0][1]:1;
  var provHtml='';
  provSorted.forEach(function(p){var w=Math.round(p[1]/provMax*100,1);provHtml+='<div class="prov-bar"><div class="prov-name">'+p[0]+'</div><div class="prov-fill" style="width:'+w+'%">'+p[1]+'条</div></div>';});
  document.getElementById('provBars').innerHTML=provHtml;

  // Province filter
  var provOpts='<option value="all">全部地区</option>';
  Object.keys(D.province_dist).sort().forEach(function(p){provOpts+='<option value="'+p+'">'+p+'</option>';});
  document.getElementById('provFilter').innerHTML=provOpts;

  // Service type filter buttons
  var svcBtns='<span style="font-size:12px;color:#888;margin-right:4px;margin-left:12px">类型：</span><button class="filter-btn svc-btn active" onclick="filterSvc(\'all\',this)">全部</button>';
  Object.keys(D.type_dist).sort().forEach(function(t){svcBtns+='<button class="filter-btn svc-btn" onclick="filterSvc(\''+t.replace(/'/g,"\\'")+'\',this)">'+t+'</button>';});
  document.getElementById('svcBtns').innerHTML=svcBtns;

  // Table
  renderTable(items);

  // Charts
  var trendCounts=dates.map(function(d){return D.date_dist[d]||0;});

  charts.trend=new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:dates,datasets:[{label:'有效标讯数',data:trendCounts,borderColor:'#1a73e8',backgroundColor:'rgba(26,115,232,0.1)',fill:true,tension:0.3,pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,grid:{color:'#f0f0f0'}},x:{grid:{display:false}}},plugins:{legend:{display:false}}}});

  charts.price=new Chart(document.getElementById('pricePie'),{type:'doughnut',data:{labels:['💎≥100万('+s.diamond+'条)','🔥50-100万('+s.fire+'条)','🏆<50万('+s.trophy+'条)','无预算('+s.no_budget+'条)'],datasets:[{data:[s.diamond,s.fire,s.trophy,s.no_budget],backgroundColor:['#f9a825','#ff6f00','#43a047','#bdbdbd']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11}}}}}});

  var svcLabels=Object.keys(D.type_dist), svcValues=Object.values(D.type_dist);
  charts.svc=new Chart(document.getElementById('svcPie'),{type:'doughnut',data:{labels:svcLabels,datasets:[{data:svcValues,backgroundColor:COLORS.slice(0,svcLabels.length)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:12}}}}});

  // Stacked bar
  var allSvcs=Object.keys(D.type_dist).sort();
  var stackDs=allSvcs.map(function(svc,i){
    return {label:svc,data:dates.map(function(d){return D.date_type[d]?D.date_type[d][svc]||0:0;}),backgroundColor:COLORS[i%COLORS.length]};
  });
  charts.stack=new Chart(document.getElementById('stackChart'),{type:'bar',data:{labels:dates,datasets:stackDs},options:{responsive:true,maintainAspectRatio:false,scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,beginAtZero:true,grid:{color:'#f0f0f0'}}},plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:12}}}}});

  // Budget trend
  var budgetByDate={};
  items.forEach(function(it){if(it.date&&it.date.startsWith('202')){budgetByDate[it.date]=(budgetByDate[it.date]||0)+it.budget;}});
  var budgetTrend=dates.map(function(d){return Math.round((budgetByDate[d]||0)*100)/100;});
  charts.budget=new Chart(document.getElementById('budgetChart'),{type:'bar',data:{labels:dates,datasets:[{label:'预算金额(万)',data:budgetTrend,backgroundColor:'rgba(26,115,232,0.7)',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,grid:{color:'#f0f0f0'}},x:{grid:{display:false}}},plugins:{legend:{display:false}}}});
}

function renderTable(items){
  document.getElementById('tableTitle').textContent='📋 全量标讯明细（共 '+items.length+' 条）';
  var html='';
  items.forEach(function(it){
    var tier,tierTag,rc;
    if(it.budget>=100){tier='diamond';tierTag='💎';rc='row-diamond';}
    else if(it.budget>=50){tier='hot';tierTag='🔥';rc='row-hot';}
    else if(it.budget>0){tier='normal';tierTag='🏆';rc='';}
    else{tier='nobudget';tierTag='';rc='';}

    var budgetCell=it.budget>0?it.budget.toFixed(2)+'万':'未披露';
    var linkCell=it.url&&it.url!=='点击查看'?'<a href="'+it.url+'" target="_blank" rel="noopener">查看</a>':'';
    var escTitle=it.title.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    var escBuyer=it.buyer.replace(/</g,'&lt;').replace(/>/g,'&gt;');

    html+='<tr class="'+rc+'" data-tier="'+tier+'" data-prov="'+it.province+'" data-svc="'+it.type+'" data-date="'+it.date+'">';
    html+='<td class="title-col">'+tierTag+' '+escTitle+'</td>';
    html+='<td>'+escBuyer+'</td>';
    html+='<td class="money-cell">'+budgetCell+'</td>';
    html+='<td>'+it.type+'</td>';
    html+='<td>'+it.province+'</td>';
    html+='<td class="date-col">'+it.date+'</td>';
    html+='<td>'+linkCell+'</td>';
    html+='</tr>';
  });
  document.getElementById('tableBody').innerHTML=html;
}

// Filter logic
var currentTier='all', currentSvc='all';
function filterTier(tier,btn){
  document.querySelectorAll('.tier-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active'); currentTier=tier; applyAllFilters();
}
function filterSvc(svc,btn){
  document.querySelectorAll('.svc-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active'); currentSvc=svc; applyAllFilters();
}
function clearDateFilter(){document.getElementById('dateFilter').value='';applyAllFilters();}
function applyAllFilters(){
  var tier=currentTier, svc=currentSvc, date=document.getElementById('dateFilter').value, prov=document.getElementById('provFilter').value;
  document.querySelectorAll('.table-scroll tbody tr').forEach(function(tr){
    var show=true;
    if(tier!=='all'&&tr.dataset.tier!==tier)show=false;
    if(svc!=='all'&&tr.dataset.svc!==svc)show=false;
    if(date&&tr.dataset.date!==date)show=false;
    if(prov!=='all'&&tr.dataset.prov!==prov)show=false;
    tr.style.display=show?'':'none';
  });
}
</script>
</body>
</html>
